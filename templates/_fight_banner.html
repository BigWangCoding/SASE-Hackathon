<div class="session-bar">
  <div class="bar">
    <span class="timer" data-elapsed="{{ elapsed_seconds(g.fight.started_at) }}" data-scale="{{ time_scale }}">0:00</span>
    <span>
      Studying at <strong>{{ place(g.fight.dungeon).name }}</strong>
      <span class="caption">
        · {% if g.fight.party_id %}with your party (+{{ rewards.bonus }}% if 2+ members){% else %}solo{% endif %}
        · {{ rewards.cc }} CC and {{ rewards.xp }} XP per minute
      </span>
    </span>
    <form method="post" action="{{ url_for('finish_fight') }}">
      {{ next_field() }}
      <button class="btn" type="submit">Finish and collect</button>
    </form>
  </div>
</div>
