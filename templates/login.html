{% extends "public.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="form" style="max-width: 400px">
  <h1>Log in</h1>
  <form method="post">
    <label class="field"><span>OU email</span>
      <input type="email" name="email" value="{{ form.get('email', '') }}" required autofocus>
    </label>
    <label class="field"><span>Password</span>
      <input type="password" name="password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="caption">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
