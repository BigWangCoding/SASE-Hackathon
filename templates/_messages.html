{% for m in messages %}
  <div class="message{% if m.user_id == g.user.id %} mine{% endif %}" data-id="{{ m.id }}">
    <a href="{{ url_for('player', user_id=m.user_id) }}">{{ avatar_svg(m, 32, bust=True) }}</a>
    <div class="grow">
      <div class="message-head">
        <a href="{{ url_for('player', user_id=m.user_id) }}">{{ display_name(m) }}</a>
        <span class="caption">{{ m.sent_at | when }}</span>
      </div>
      <p>{{ m.body }}</p>
    </div>
  </div>
{% endfor %}
