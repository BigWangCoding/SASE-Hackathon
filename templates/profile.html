{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="form">
  <h1>Edit profile</h1>
  <p class="caption">{{ g.user.email }}</p>
  <form method="post">
    {% include "_profile_fields.html" %}
    <div class="actions">
      <button class="btn" type="submit">Save</button>
      <a href="{{ url_for('player', user_id=g.user.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
