{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Log in</h1>
  <form method="post">
    <label>OU email
      <input type="email" name="email" value="{{ form.get('email', '') }}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('signup') }}">Create a profile</a></p>
</div>
{% endblock %}
