<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Sooner Study Buddy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Sooner Study Buddy</a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('rooms') }}">Find rooms</a>
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('logout') }}">Log out</a>
        <a class="btn btn-small" href="{{ url_for('new_room') }}">+ Post a room</a>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a class="btn btn-small" href="{{ url_for('signup') }}">Sign up</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
